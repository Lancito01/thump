name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Thump -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -o publish
          Compress-Archive -Path publish/Thump.exe, LICENSE, README.md -DestinationPath Thump-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Thump-win-x64.zip
          generate_release_notes: true
