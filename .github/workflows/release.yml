name: Release

# Push a tag like v0.2.0 to build and publish a release (installer + portable zip).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Thump -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -o publish
          Copy-Item LICENSE, README.md publish/
          Compress-Archive -Path publish/Thump.exe, publish/LICENSE, publish/README.md -DestinationPath Thump-win-x64-portable.zip
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet build installer -c Release -p:Version=$version
          Copy-Item installer/bin/Release/Thump-$version.msi .
          Copy-Item src/Thump/Assets/drums.thdm .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Thump-*.msi
            Thump-win-x64-portable.zip
            drums.thdm
          generate_release_notes: true
